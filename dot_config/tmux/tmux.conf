# ==============================================================================
# Tmux Configuration
# ==============================================================================

# Prefix
set -g prefix C-b
bind C-b send-prefix

# Shell
set -g default-shell /usr/bin/zsh

# Speed & Performance
set -s escape-time 0
set -g repeat-time 0
set -g focus-events on
set -g history-limit 50000

# Terminal & Colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Usability & Workmux
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Keybindings
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind x kill-pane
bind q kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Window navigation (Ctrl-b 1..9)
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9

# Floating Popups
# Ctrl-b n -> sessionizer
bind n display-popup -w 80% -h 70% -E "tmux-sessionizer"

# Ctrl-b g -> lazygit in current working directory
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Minimal Status Bar
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=default,fg=colour7"
set -g status-left "#[bold]#S #[nobold]| "
set -g status-left-length 40
set -g status-right "%H:%M"
set -g status-right-length 40
